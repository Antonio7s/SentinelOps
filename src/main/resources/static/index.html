<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="ICO.png" type="image/png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SentinelOps — Financial Resilience Command Center</title>
  <meta name="description" content="SentinelOps real-time AI-powered financial risk monitoring dashboard" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --bg-deep:    #070c1a;
      --bg-card:    rgba(255,255,255,0.035);
      --border:     rgba(255,255,255,0.07);
      --border-h:   rgba(99,102,241,0.5);
    }
    * { box-sizing: border-box; }
    body { background: var(--bg-deep); font-family: 'Inter', sans-serif; }

    /* Grid background */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(99,102,241,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    /* Glassmorphism */
    .glass {
      background: var(--bg-card);
      backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid var(--border);
    }
    .glass:hover { border-color: rgba(99,102,241,0.25); }

    /* Status pills */
    .pill-approved { background:rgba(16,185,129,.12); color:#34d399; border:1px solid rgba(16,185,129,.25); }
    .pill-blocked  { background:rgba(239,68,68,.12);  color:#f87171; border:1px solid rgba(239,68,68,.25);  }
    .pill-review   { background:rgba(245,158,11,.12); color:#fbbf24; border:1px solid rgba(245,158,11,.25); }
    .pill-pending  { background:rgba(99,102,241,.12); color:#a5b4fc; border:1px solid rgba(99,102,241,.25); }

    /* CB badge */
    .cb-closed { background:rgba(16,185,129,.18); color:#34d399; border:1px solid rgba(16,185,129,.35); }
    .cb-open   { background:rgba(239,68,68,.18);  color:#f87171; border:1px solid rgba(239,68,68,.35);  }
    .cb-half   { background:rgba(245,158,11,.18); color:#fbbf24; border:1px solid rgba(245,158,11,.35); }
    .cb-unk    { background:rgba(148,163,184,.18); color:#94a3b8; border:1px solid rgba(148,163,184,.35); }

    /* Animations */
    @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }
    @keyframes fadeSlideUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    @keyframes spin-once { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes toast-in { from{opacity:0;transform:translateX(120%)} to{opacity:1;transform:translateX(0)} }
    @keyframes toast-out { from{opacity:1;transform:translateX(0)} to{opacity:0;transform:translateX(120%)} }
    @keyframes shimmer { from{background-position:-200% 0} to{background-position:200% 0} }

    .pulse { animation: pulse-dot 2s ease-in-out infinite; }
    .fade-up { animation: fadeSlideUp .35s ease forwards; }
    .spin-once { animation: spin-once .6s linear; }
    .toast-in  { animation: toast-in .3s cubic-bezier(.16,1,.3,1) forwards; }
    .toast-out { animation: toast-out .25s ease forwards; }

    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,.04) 25%, rgba(255,255,255,.08) 50%, rgba(255,255,255,.04) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }

    /* Metric cards */
    .metric-card { transition: transform .2s ease, box-shadow .2s ease; }
    .metric-card:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,.4); }

    /* Table rows */
    tr.tx-row { transition: background .15s; }
    tr.tx-row:hover { background: rgba(255,255,255,.04); }
    tr.tx-row:hover .inspect-btn { opacity: 1; }
    .inspect-btn { opacity: 0; transition: opacity .2s; }

    /* Modal */
    .modal-overlay {
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(10px);
    }

    /* Timeline */
    .timeline-step:not(:last-child)::after {
      content: '';
      position: absolute;
      left: 19px; top: 44px;
      width: 2px;
      height: calc(100% - 4px);
      background: linear-gradient(to bottom, rgba(99,102,241,.35), transparent);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(99,102,241,.3); border-radius: 2px; }

    /* Button */
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      transition: all .2s;
    }
    .btn-primary:hover { background: linear-gradient(135deg, #4338ca, #6d28d9); box-shadow: 0 0 20px rgba(99,102,241,.35); }
    .btn-primary:active { transform: scale(.97); }
  </style>
</head>

<body class="text-slate-100 min-h-screen relative">

    <!-- Right badges -->
    <div class="flex items-center gap-2 flex-wrap justify-end">

<!-- ════════════════════════ JAVASCRIPT ════════════════════════ -->
<script>
// ── Constants ─────────────────────────────────────────────────────────────
const REFRESH_MS = 3000;
const API_BASE   = '';

// ── Clock ─────────────────────────────────────────────────────────────────
const clockEl = document.getElementById('live-clock');
function tick() {
  clockEl.textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
}
setInterval(tick, 1000);
tick();

// ── Metrics ───────────────────────────────────────────────────────────────
const METRICS_DEF = [
  { k: 'totalTransactions',       label: 'Total',         icon: 'fa-layer-group',   clr: '#818cf8', accent: 'rgba(99,102,241,' },
  { k: 'approvedCount',           label: 'Approved',      icon: 'fa-circle-check',  clr: '#34d399', accent: 'rgba(16,185,129,' },
  { k: 'blockedCount',            label: 'Blocked',       icon: 'fa-ban',           clr: '#f87171', accent: 'rgba(239,68,68,'  },
  { k: 'manualReviewCount',       label: 'Manual Review', icon: 'fa-eye',           clr: '#fbbf24', accent: 'rgba(245,158,11,' },
  { k: 'approvalRate',            label: 'Approval Rate', icon: 'fa-chart-pie',     clr: '#c084fc', accent: 'rgba(192,132,252,',
    fmt: v => (v * 100).toFixed(1) + '%' },
  { k: 'averageProcessingTimeMs', label: 'Avg Latency',   icon: 'fa-stopwatch',     clr: '#38bdf8', accent: 'rgba(56,189,248,',
    fmt: v => v >= 1000 ? (v/1000).toFixed(2) + 's' : Math.round(v) + 'ms' },
];

function renderMetrics(d) {
  const bar = document.getElementById('metrics-bar');
  bar.innerHTML = METRICS_DEF.map(m => {
    const raw = d[m.k] ?? 0;
    const val = m.fmt ? m.fmt(raw) : raw;
    return `
    <div class="metric-card glass rounded-2xl p-3 cursor-default fade-up"
         style="background:linear-gradient(135deg,${m.accent}.07) 0%,${m.accent}.02) 100%);">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs text-slate-500 font-medium uppercase tracking-wider leading-none">${m.label}</span>
        <i class="fa-solid ${m.icon} text-xs" style="color:${m.clr};opacity:.75"></i>
      </div>
      <div class="text-xl font-black text-white tabular-nums">${val}</div>
    </div>`;
  }).join('');

  // Circuit Breaker
  const s = d.circuitBreakerStatus || 'UNKNOWN';
  const cbBadge = document.getElementById('cb-badge');
  const cbDot   = document.getElementById('cb-dot');
  const cbText  = document.getElementById('cb-text');
  cbBadge.className = 'flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold select-none ';
  if      (s === 'CLOSED')    { cbBadge.className += 'cb-closed'; cbDot.style.background = '#34d399'; }
  else if (s === 'OPEN')      { cbBadge.className += 'cb-open';   cbDot.style.background = '#f87171'; }
  else if (s === 'HALF_OPEN') { cbBadge.className += 'cb-half';   cbDot.style.background = '#fbbf24'; }
  else                        { cbBadge.className += 'cb-unk';    cbDot.style.background = '#94a3b8'; }
  cbText.textContent = s;
}

async function fetchMetrics() {
  const icon = document.getElementById('refresh-icon');
  icon.className = 'fa-solid fa-arrows-rotate text-indigo-500 text-xs spin-once';
  setTimeout(() => icon.className = 'fa-solid fa-arrows-rotate text-indigo-500 text-xs', 700);
  try {
    const r = await fetch(API_BASE + '/api/v1/observability/metrics');
    if (r.ok) renderMetrics(await r.json());
  } catch(e) { console.error('metrics error', e); }
}

// ── Transactions ───────────────────────────────────────────────────────────
function maskId(id) {
  if (!id || id.length < 6) return id || '***';
  return id.slice(0, 3) + '-***' + id.slice(-2);
}
function fmtCurrency(v) {
  return new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL' }).format(v);
}
function timeAgo(raw) {
  if (!raw) return '';
  const ms = Date.now() - new Date(raw).getTime();
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  return new Date(raw).toLocaleTimeString('en-US', { hour12:false, hour:'2-digit', minute:'2-digit' });
}
function statusPill(st) {
  const m = {
    APPROVED:      ['pill-approved', 'fa-check',  'Approved'],
    BLOCKED:       ['pill-blocked',  'fa-ban',    'Blocked'],
    MANUAL_REVIEW: ['pill-review',   'fa-eye',    'Review'],
    PENDING:       ['pill-pending',  'fa-clock',  'Pending'],
  };
  const [cls, icon, lbl] = m[st] || m.PENDING;
  return `<span class="${cls} inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold">
    <i class="fa-solid ${icon}" style="font-size:9px"></i>${lbl}
  </span>`;
}

function renderTransactions(txs) {
  const count = document.getElementById('tx-count');
  const tbody = document.getElementById('tx-body');
  count.textContent = txs.length + ' tx';
  if (!txs.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="py-12 text-center text-slate-600 text-sm">
      No transactions yet — use Quick Inject to start
    </td></tr>`;
    return;
  }
  tbody.innerHTML = txs.reverse().slice(0, 40).map(tx => `
  <tr class="tx-row" style="border-bottom:1px solid rgba(255,255,255,.04)">
    <td class="py-2.5 px-3 font-mono text-xs text-slate-300">${maskId(tx.accountId)}</td>
    <td class="py-2.5 px-3 text-right font-mono text-xs text-white font-semibold">${fmtCurrency(tx.amount)}</td>
    <td class="py-2.5 px-3 text-xs text-slate-400">${tx.merchantCategory || '—'}</td>
    <td class="py-2.5 px-3">${statusPill(tx.status)}</td>
    <td class="py-2.5 px-3 text-xs text-slate-600 font-mono">${timeAgo(tx.ingestedAt)}</td>
    <td class="py-2.5 px-3">
      <button class="inspect-btn px-2.5 py-1 rounded-lg text-xs font-medium flex items-center gap-1.5"
        style="background:rgba(99,102,241,.12);color:#a5b4fc;border:1px solid rgba(99,102,241,.25)"
        onclick="openTrace('${tx.transactionId}')">
        <i class="fa-solid fa-magnifying-glass" style="font-size:9px"></i> Inspect
      </button>
    </td>
  </tr>`).join('');
}

async function fetchTransactions() {
  try {
    const r = await fetch(API_BASE + '/api/v1/transactions?limit=40');
    if (r.ok) renderTransactions(await r.json());
  } catch(e) { console.error('tx error', e); }
}

// ── Presets ────────────────────────────────────────────────────────────────
const PRESETS = {
  safe:       { accountId: 'STD-SAFE01',  amount: 45.00,    merchantCategory: 'GROCERY'     },
  highvalue:  { accountId: 'VIP-HV001',   amount: 15000.00, merchantCategory: 'JEWELRY'     },
  nightfraud: { accountId: 'FRD-NIGHT01', amount: 4850.00,  merchantCategory: 'ELECTRONICS' },
};
async function injectPreset(name) { await submit(PRESETS[name]); }

document.getElementById('manual-form').addEventListener('submit', async e => {
  e.preventDefault();
  await submit({
    accountId:        document.getElementById('f-account').value.trim()  || 'ACC-MANUAL01',
    amount:           parseFloat(document.getElementById('f-amount').value) || 100,
    merchantCategory: document.getElementById('f-category').value,
  });
});

async function submit(payload) {
  try {
    const r = await fetch(API_BASE + '/api/v1/transactions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (r.ok) {
      const d = await r.json();
      toast('success', 'Transaction submitted', `${d.transactionId.slice(0,8)}… · Awaiting AI triage`);
      await Promise.all([fetchTransactions(), fetchMetrics()]);
    } else {
      toast('error', 'Submission failed', 'HTTP ' + r.status);
    }
  } catch(e) { toast('error', 'Network error', e.message); }
}

// ── Trace Modal ────────────────────────────────────────────────────────────
async function openTrace(txId) {
  const modal = document.getElementById('trace-modal');
  modal.style.display = 'flex';
  document.getElementById('modal-sub').textContent = 'Loading trace for ' + txId.slice(0,8) + '…';
  document.getElementById('modal-summary').innerHTML =
    '<div class="col-span-4 py-4 text-center text-slate-600 text-sm"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Fetching agent chain…</div>';
  document.getElementById('modal-timeline').innerHTML = '';

  try {
    const r = await fetch(API_BASE + '/api/v1/observability/trace/' + txId);
    if (!r.ok) { toast('error', 'Trace not found', 'HTTP ' + r.status); closeModal(); return; }
    renderTrace(await r.json());
  } catch(e) { toast('error', 'Trace error', e.message); closeModal(); }
}

function renderTrace(d) {
  document.getElementById('modal-sub').textContent =
    (d.accountIdMasked || '***') + ' · ' + fmtCurrency(d.amount) + ' · ' +
    (d.merchantCategory || '') + ' · ' + (d.finalStatus || '');

  // Summary
  const statusColorMap = {
    APPROVED:'color:#34d399', BLOCKED:'color:#f87171',
    MANUAL_REVIEW:'color:#fbbf24', PENDING:'color:#a5b4fc'
  };
  const statusStyle = statusColorMap[d.finalStatus] || 'color:#94a3b8';
  document.getElementById('modal-summary').innerHTML = [
    { label:'Final Status',    value: d.finalStatus || '—',
      style: statusStyle },
    { label:'Total Latency',   value: d.totalLatencyMs ? (d.totalLatencyMs/1000).toFixed(2)+'s' : '—',
      style: 'color:#38bdf8' },
    { label:'Policy Override', value: d.policyOverridden ? '⚡ YES' : '✓ None',
      style: d.policyOverridden ? 'color:#fbbf24' : 'color:#34d399' },
    { label:'Agent Steps',     value: (d.executionChain?.length || 0) + ' steps',
      style: 'color:#a5b4fc' },
  ].map(s => `
    <div class="glass rounded-xl p-3 fade-up">
      <div class="text-xs text-slate-500 mb-1">${s.label}</div>
      <div class="text-sm font-bold" style="${s.style}">${s.value}</div>
    </div>`).join('');

  // Override reason
  let overrideHtml = '';
  if (d.policyOverridden && d.overrideReason) {
    overrideHtml = `<div class="rounded-xl p-3 text-xs font-mono text-amber-300"
      style="background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2)">
      <i class="fa-solid fa-triangle-exclamation mr-2"></i>${d.overrideReason}</div>`;
  }

  // Timeline
  const chain = d.executionChain || [];
  const agentConf = {
    TRIAGE:     { icon:'fa-robot',            color:'#818cf8', bg:'rgba(99,102,241,' },
    FORENSIC:   { icon:'fa-fingerprint',      color:'#c084fc', bg:'rgba(192,132,252,' },
    RESOLUTION: { icon:'fa-scale-balanced',   color:'#34d399', bg:'rgba(16,185,129,' },
  };

  document.getElementById('modal-timeline').innerHTML = overrideHtml + chain.map((step, i) => {
    const key = Object.keys(agentConf).find(k => (step.agentName||'').toUpperCase().includes(k)) || 'TRIAGE';
    const cfg = agentConf[key];
    const isLast = i === chain.length - 1;

    let thought = {};
    try { thought = JSON.parse(step.thoughtProcess || '{}'); } catch(e) {}

    const details = buildDetails(thought, step.agentName || '');

    return `
    <div class="timeline-step relative flex gap-4 ${isLast ? '' : 'pb-5'}">
      <!-- Icon -->
      <div class="flex-shrink-0 w-10 h-10 rounded-xl flex items-center justify-center z-10"
           style="background:${cfg.bg}.15);border:1px solid ${cfg.bg}.3)">
        <i class="fa-solid ${cfg.icon} text-sm" style="color:${cfg.color}"></i>
      </div>

      <!-- Card -->
      <div class="flex-1 glass rounded-xl p-4 fade-up">
        <div class="flex items-start justify-between gap-2 mb-3">
          <div>
            <div class="font-semibold text-sm text-white">${step.agentName || '—'}</div>
            <div class="flex items-center gap-2 mt-1 flex-wrap">
              <span class="text-xs px-2 py-0.5 rounded-full font-medium"
                    style="background:${cfg.bg}.1);color:${cfg.color};border:1px solid ${cfg.bg}.25)">
                ${step.identityRole || '—'}
              </span>
              <span class="text-xs text-slate-600 font-mono">${step.latencyMs ?? '—'}ms</span>
            </div>
          </div>
          <div class="text-right flex-shrink-0">
            ${decisionBadge(step.decision)}
            ${step.timestamp
              ? `<div class="text-xs text-slate-700 mt-1 font-mono">${new Date(step.timestamp).toLocaleTimeString('en-US',{hour12:false})}</div>`
              : ''}
          </div>
        </div>

        <!-- Details -->
        ${details}

        <!-- Input summary -->
        ${step.inputSummary ? `
        <div class="mt-3 pt-3 text-xs text-slate-600 italic"
             style="border-top:1px solid rgba(255,255,255,.05)">
          <i class="fa-solid fa-arrow-right-to-bracket mr-1.5 text-slate-700"></i>${step.inputSummary}
        </div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function buildDetails(t, agentName) {
  const up = agentName.toUpperCase();
  const rows = [];

  if (up.includes('TRIAGE')) {
    if (t.riskScore !== undefined) {
      const rs = parseFloat(t.riskScore);
      const color = rs > .7 ? '#f87171' : rs > .35 ? '#fbbf24' : '#34d399';
      rows.push(['Risk Score', `<span class="font-mono font-bold" style="color:${color}">${rs.toFixed(2)}</span>`]);
    }
    if (t.reason) rows.push(['AI Reasoning',
      `<span class="text-slate-300">${(t.reason+'').slice(0,160)}${t.reason.length>160?'…':''}</span>`]);
    if (t.armorApplied !== undefined) rows.push(['Model Armor',
      `<span style="color:${t.armorApplied?'#34d399':'#f87171'}">${t.armorApplied?'✓ Applied':'✗ Bypassed'}</span>`]);
    if (t.model) rows.push(['AI Model', `<span class="font-mono text-indigo-300">${t.model}</span>`]);

  } else if (up.includes('FORENSIC')) {
    if (t.anomalyScore !== undefined) {
      const as = parseFloat(t.anomalyScore);
      const color = as > .7 ? '#f87171' : as > .4 ? '#fbbf24' : '#34d399';
      rows.push(['Anomaly Score', `<span class="font-mono font-bold" style="color:${color}">${as.toFixed(2)}</span>`]);
    }
    if (t.hasAnomaly !== undefined) rows.push(['Anomaly Detected',
      `<span style="color:${t.hasAnomaly?'#f87171':'#34d399'}">${t.hasAnomaly?'⚠ YES':'✓ None'}</span>`]);
    if (t.patterns) {
      const p = Array.isArray(t.patterns) ? t.patterns : [t.patterns];
      rows.push(['Patterns', `<span class="font-mono text-slate-300">${p.join(', ')}</span>`]);
    }

  } else if (up.includes('RESOLUTION')) {
    if (t.policyOverridden !== undefined) rows.push(['Policy Override',
      `<span style="color:${t.policyOverridden?'#fbbf24':'#34d399'}">${t.policyOverridden?'⚡ YES — Human-in-the-Loop activated':'✓ None'}</span>`]);
    if (t.policyJustification) rows.push(['Justification',
      `<span class="text-slate-300">${(t.policyJustification+'').slice(0,120)}${t.policyJustification.length>120?'…':''}</span>`]);
    if (t.zeroTrustVerified !== undefined) rows.push(['Zero-Trust',
      `<span style="color:${t.zeroTrustVerified?'#34d399':'#f87171'}">${t.zeroTrustVerified?'✓ Verified':'✗ Violation'}</span>`]);
  }

  if (!rows.length) return '';
  return `<div class="space-y-2 mt-2">
    ${rows.map(([k,v]) => `
    <div class="flex items-start gap-3 text-xs">
      <span class="text-slate-500 font-medium flex-shrink-0 w-28">${k}</span>
      <span class="flex-1 min-w-0">${v}</span>
    </div>`).join('')}
  </div>`;
}

function decisionBadge(decision) {
  if (!decision) return '';
  const d = decision.toUpperCase();
  let style = 'background:rgba(148,163,184,.1);color:#94a3b8;border:1px solid rgba(148,163,184,.2)';
  if (d.includes('APPROVED'))          style = 'background:rgba(16,185,129,.1);color:#34d399;border:1px solid rgba(16,185,129,.25)';
  else if (d.includes('BLOCKED'))      style = 'background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.25)';
  else if (d.includes('MANUAL')||d.includes('REVIEW')) style = 'background:rgba(245,158,11,.1);color:#fbbf24;border:1px solid rgba(245,158,11,.25)';
  else if (d.includes('OVERRIDE'))     style = 'background:rgba(251,146,60,.1);color:#fb923c;border:1px solid rgba(251,146,60,.25)';
  const label = decision.replace('POLICY_CONFIRMED_','').replace('POLICY_OVERRIDE_','⚡ ').replace(/_/g,' ');
  return `<span class="text-xs px-2 py-0.5 rounded-full font-semibold" style="${style}">${label}</span>`;
}

function closeModal() {
  document.getElementById('trace-modal').style.display = 'none';
}
document.getElementById('trace-modal').addEventListener('click', e => { if(e.target === e.currentTarget) closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

// ── Toast ──────────────────────────────────────────────────────────────────
function toast(type, title, msg) {
  const c = document.getElementById('toasts');
  const id = 'toast-' + Date.now();
  const icons = { success:'fa-circle-check', error:'fa-circle-xmark', info:'fa-circle-info' };
  const colors = { success:'#34d399', error:'#f87171', info:'#818cf8' };
  const div = document.createElement('div');
  div.id = id;
  div.className = 'glass rounded-xl p-4 toast-in shadow-xl';
  div.style.boxShadow = '0 8px 32px rgba(0,0,0,.5)';
  div.innerHTML = `
    <div class="flex items-start gap-3">
      <i class="fa-solid ${icons[type]} mt-0.5 flex-shrink-0" style="color:${colors[type]}"></i>
      <div class="flex-1 min-w-0">
        <div class="text-sm font-semibold text-white">${title}</div>
        <div class="text-xs text-slate-400 mt-0.5 truncate">${msg}</div>
      </div>
      <button onclick="document.getElementById('${id}').remove()"
        class="text-slate-600 hover:text-white transition-colors text-xs flex-shrink-0">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>`;
  c.appendChild(div);
  setTimeout(() => {
    const el = document.getElementById(id);
    if (el) { el.className = el.className.replace('toast-in','toast-out'); setTimeout(()=>el.remove(), 300); }
  }, 4000);
}

// ── Init ───────────────────────────────────────────────────────────────────
async function refresh() {
  await Promise.all([fetchMetrics(), fetchTransactions()]);
}
refresh();
setInterval(refresh, REFRESH_MS);
</script>
